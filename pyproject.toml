[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "micro2damask"
version = "0.1.0"
description = "Image-based microstructure to DAMASK RVE generator"
requires-python = ">=3.10"
dependencies = ["numpy","pandas","opencv-python","matplotlib","scipy","scikit-image","PyYAML"]

[project.optional-dependencies]
damask = ["damask"]
vtk = ["vtk"]

[project.scripts]
micro2damask = "micro2damask.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
